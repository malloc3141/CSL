[project]
name = "csl-backend"
version = "0.1.0"
description = "Serving layer for CSL (Classroom Simulation for Learning): session orchestrator, WebSocket API, pipeline interface."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_default_fixture_loop_scope = "function"
